services:
  - type: web
    name: tarot-qna
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_FALLBACKS
        value: openai/gpt-oss-120b,qwen/qwen3.6-27b,openai/gpt-oss-20b
